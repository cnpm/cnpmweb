name: Deploy to Void

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

# An accepted Void deployment continues even if its CLI is interrupted.
concurrency:
  group: void-deploy-cnpmweb
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      VOID_API_URL: ${{ vars.VOID_API_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Connect to Void
        run: npm run void -- connect "$VOID_API_URL" --no-login

      - name: Deploy with GitHub OIDC
        run: npm run deploy
